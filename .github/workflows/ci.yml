name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build-time env is not required: the app feature-detects and builds
          # cleanly with no credentials (demo mode). Set real values in the
          # deployment environment, not CI.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
